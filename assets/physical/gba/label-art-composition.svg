<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300">
  <defs>
    <linearGradient id="stickerBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3049"/>
      <stop offset="1" stop-color="#0c1624"/>
    </linearGradient>
  </defs>

  <!-- Deliberate cartridge-label layout for the "art" path (cover art
       as source material). 440x300 = the label well. Opaque sticker
       base with a REAL transparent art window at (24,24,392,188) via
       evenodd — QML places intentionally-framed art underneath, then a
       vignette, then this frame. Title lives in the guided zone below
       the rule (QML text at y 232-276); micro brand mark bottom-right. -->

  <!-- opaque base, transparent art window -->
  <path d="M0,0H440V300H0Z M24,24H416V212H24Z"
        fill-rule="evenodd" fill="url(#stickerBase)"/>

  <!-- art window frame: ice keyline + inner key shadow -->
  <rect x="24" y="24" width="392" height="188" fill="none"
        stroke="#7ba7d9" stroke-width="2" opacity="0.55"/>
  <rect x="29" y="29" width="382" height="178" fill="none"
        stroke="#05090e" stroke-width="3" opacity="0.7"/>

  <!-- rule above the title zone -->
  <rect x="24" y="224" width="392" height="3" fill="#7ba7d9" opacity="0.6"/>

  <!-- title-zone guides -->
  <rect x="24" y="284" width="150" height="4" fill="#7ba7d9" opacity="0.35"/>
  <circle cx="404" cy="286" r="3" fill="#7ba7d9" opacity="0.5"/>

  <!-- sticker corner dots -->
  <circle cx="11" cy="11" r="3" fill="#7ba7d9" opacity="0.45"/>
  <circle cx="429" cy="11" r="3" fill="#7ba7d9" opacity="0.45"/>
  <circle cx="11" cy="289" r="3" fill="#7ba7d9" opacity="0.45"/>
  <circle cx="429" cy="289" r="3" fill="#7ba7d9" opacity="0.45"/>
</svg>
