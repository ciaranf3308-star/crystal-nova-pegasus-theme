<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="950" viewBox="0 0 150 950">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="0.5" stop-color="#1c2634"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="recedeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="recedeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="150" height="950" fill="url(#spine)"/>

  <!-- spine window (left empty) -->
  <rect x="30" y="26" width="90" height="898" fill="none" stroke="#0a0f16" stroke-width="6" opacity="0.6"/>
  <rect x="30" y="26" width="90" height="898" fill="none" stroke="#cfe2f5" stroke-width="1.5" opacity="0.5"/>

  <!-- recede shading (faces falling away) -->
  <rect x="0" y="0" width="30" height="950" fill="url(#recedeL)"/>
  <rect x="120" y="0" width="30" height="950" fill="url(#recedeR)"/>

  <!-- top / bottom ridges -->
  <line x1="8" y1="10" x2="142" y2="10" stroke="#2c3a4e" stroke-width="2"/>
  <line x1="8" y1="940" x2="142" y2="940" stroke="#2c3a4e" stroke-width="2"/>
</svg>
